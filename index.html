<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학습 플래너">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F6F1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>효주 학습 플래너</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* 레이아웃: 왼쪽 메뉴 + 카드형 대시보드. 좁은 화면에서는 위쪽 가로 메뉴로 바뀐다. */
:root{
  --bg:#F7F6F1; --card:#FFFFFF; --sunk:#F2F1EC; --ink:#22252A; --ink2:#575C66; --ink3:#8B9098;
  --line:#E7E5DE; --line2:#D8D5CC;
  --accent:#3B3E43; --accent-ink:#FFFFFF; --accent-soft:#ECEAE4;
  --danger:#B0473C; --danger-soft:#F8E7E4; --ok:#3B7A56; --ok-soft:#E4F1E8;
  --exam:#B56E22; --exam-soft:#FBEFDF;
  --shadow:0 1px 2px rgba(34,37,42,.04),0 6px 18px rgba(34,37,42,.05);
  --kr-bg:#FBE4E1; --kr-fg:#A8433A;
  --ma-bg:#E1EBF8; --ma-fg:#335F9E;
  --en-bg:#FAF0C6; --en-fg:#7A5E0E;
  --so-bg:#DFF0E3; --so-fg:#2F7348;
  --sc-bg:#FBE3EE; --sc-fg:#A33B70;
  --hi-bg:#ECE4F7; --hi-fg:#6646A0;
  --pe-bg:#DDEFEC; --pe-fg:#2C6B65;
  --ar-bg:#F3E9DD; --ar-fg:#80562E;
  --gy-bg:#EFEFEC; --gy-fg:#7A7E85;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","SF Pro Text","Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;
  --r:18px; --r-sm:11px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171A; --card:#1E2125; --sunk:#25282D; --ink:#ECEDEF; --ink2:#B4B8BF; --ink3:#81868E;
  --line:#2D3137; --line2:#3B4047;
  --accent:#DAD8D2; --accent-ink:#15171A; --accent-soft:#2C2E32;
  --danger:#E68C81; --danger-soft:#3A2522; --ok:#88C7A0; --ok-soft:#1F3328;
  --exam:#E3A660; --exam-soft:#3A2C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --kr-bg:#3D2624; --kr-fg:#F0A79E; --ma-bg:#22304A; --ma-fg:#9DBDEB; --en-bg:#3A3219; --en-fg:#EBCF73;
  --so-bg:#20352A; --so-fg:#93D1A8; --sc-bg:#3C2433; --sc-fg:#EFA3C8; --hi-bg:#30284A; --hi-fg:#C2AAEE;
  --pe-bg:#1F3634; --pe-fg:#8ED0C8; --ar-bg:#3A2E22; --ar-fg:#E0B98F; --gy-bg:#2A2D31; --gy-fg:#9EA2A9;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15171A; --card:#1E2125; --sunk:#25282D; --ink:#ECEDEF; --ink2:#B4B8BF; --ink3:#81868E;
  --line:#2D3137; --line2:#3B4047;
  --accent:#DAD8D2; --accent-ink:#15171A; --accent-soft:#2C2E32;
  --danger:#E68C81; --danger-soft:#3A2522; --ok:#88C7A0; --ok-soft:#1F3328;
  --exam:#E3A660; --exam-soft:#3A2C1B;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --kr-bg:#3D2624; --kr-fg:#F0A79E; --ma-bg:#22304A; --ma-fg:#9DBDEB; --en-bg:#3A3219; --en-fg:#EBCF73;
  --so-bg:#20352A; --so-fg:#93D1A8; --sc-bg:#3C2433; --sc-fg:#EFA3C8; --hi-bg:#30284A; --hi-fg:#C2AAEE;
  --pe-bg:#1F3634; --pe-fg:#8ED0C8; --ar-bg:#3A2E22; --ar-fg:#E0B98F; --gy-bg:#2A2D31; --gy-fg:#9EA2A9;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 14px 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.brand{padding:0 10px}
.brand b{display:block;font-size:17px;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border:0;background:none;border-radius:12px;color:var(--ink2);text-align:left;font-size:15px;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.side-foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--ink3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.warn{background:var(--exam)}

main{min-width:0;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead h1{margin:0;font-size:26px;letter-spacing:-.02em;text-wrap:balance}
.phead p{margin:2px 0 0;color:var(--ink3);font-size:14px}
.banner{padding:12px 16px;border-radius:var(--r-sm);background:var(--exam-soft);color:var(--ink);font-size:14px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:30;flex-direction:row;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav button{min-height:40px;padding:0 12px}
  .nav button svg{display:none}
  main{padding-block:18px 72px}
}

/* 카드 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.card h2{margin:0;font-size:16px;letter-spacing:-.01em}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.chead .sub{font-size:13px;color:var(--ink3)}
.muted{color:var(--ink3)}
.small{font-size:13px}
.empty{padding:18px 4px;color:var(--ink3);font-size:14px;text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px}
.icon-btn:hover{background:var(--sunk)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:36px;padding:0 12px;border-radius:9px;color:var(--ink2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* 과목 태그 */
.tag{display:inline;padding:1px 6px;border-radius:7px;font-weight:600;font-size:.94em;white-space:nowrap;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.f-kr{background:var(--kr-bg);color:var(--kr-fg)} .f-ma{background:var(--ma-bg);color:var(--ma-fg)}
.f-en{background:var(--en-bg);color:var(--en-fg)} .f-so{background:var(--so-bg);color:var(--so-fg)}
.f-sc{background:var(--sc-bg);color:var(--sc-fg)} .f-hi{background:var(--hi-bg);color:var(--hi-fg)}
.f-pe{background:var(--pe-bg);color:var(--pe-fg)} .f-ar{background:var(--ar-bg);color:var(--ar-fg)}
.f-gy{background:var(--gy-bg);color:var(--gy-fg)}
.tag.gy{background:none;color:var(--ink3);padding:0;font-weight:500}
.kind{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:1px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--ink2);margin:0 5px;vertical-align:1px;white-space:nowrap}
.kind.k-assess{border-color:var(--exam);color:var(--exam)}
.kind.k-prep{border-style:dashed}
.fbar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.fb-kr{background:var(--kr-fg)} .fb-ma{background:var(--ma-fg)} .fb-en{background:var(--en-fg)} .fb-so{background:var(--so-fg)} .fb-sc{background:var(--sc-fg)} .fb-hi{background:var(--hi-fg)} .fb-pe{background:var(--pe-fg)} .fb-ar{background:var(--ar-fg)} .fb-gy{background:var(--gy-fg)}

/* 할 일 */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:flex-start;gap:6px;border-radius:12px;background:var(--card);touch-action:auto}
.task:hover{background:var(--sunk)}
.chk{flex:none;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0;margin:-2px -4px -2px -6px}
.chk i{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line2);display:flex;align-items:center;justify-content:center;background:var(--card)}
.chk svg{width:14px;height:14px;stroke:var(--accent-ink);stroke-width:2.6;fill:none;opacity:0}
.task.done .chk i{background:var(--accent);border-color:var(--accent)}
.task.done .chk svg{opacity:1}
.tmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 4px 10px 0;line-height:1.45}
.tline{display:block;word-break:keep-all;overflow-wrap:anywhere}
.ttl{color:var(--ink)}
.tmeta{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.task.done .tmain{opacity:.45}
.task.done .ttl{text-decoration:line-through;color:var(--ink2)}
.grip{flex:none;width:36px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink3);letter-spacing:-3px;font-size:15px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.task.dragging{box-shadow:0 10px 28px rgba(0,0,0,.16);background:var(--card);opacity:.96}
.task-ph{height:44px;border-radius:12px;border:1.5px dashed var(--line2);list-style:none}
.ev{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;cursor:pointer;background:var(--card);text-align:left;width:100%}
.ev:hover{background:var(--sunk)}
.ev time{font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.evs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}

/* 주간 카드 */
.week{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.week .daycard{flex:1 0 214px;max-width:300px;min-height:min(72vh,660px);scroll-snap-align:start}
.week.scroll .daycard{flex:0 0 220px;min-height:380px}
.daycard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 12px 10px 14px;min-height:220px;display:flex;flex-direction:column;border:1.5px solid transparent;min-width:0}
.daycard.today{border-color:var(--accent)}
.daycard.past{background:color-mix(in srgb,var(--card) 88%,var(--bg))}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px}
.dnum{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.02em}
.dname{font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.04em;margin-top:3px}
.today .dname{color:var(--accent)}
.dbadges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.exam-badge{font-size:12px;font-weight:700;color:var(--exam);background:var(--exam-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.today-badge{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.daycard .tlist{flex:1}
.dfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.dfoot .count{font-size:12.5px;color:var(--ink3)}
.add-mini{border:0;background:none;color:var(--ink3);font-size:14px;min-height:36px;padding:0 8px;border-radius:9px}
.add-mini:hover{background:var(--sunk);color:var(--ink)}

/* 홈 */
.home{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.home > *{grid-column:span 12}
@media (min-width:760px){
  .home .c-dday{grid-column:span 7} .home .c-sum{grid-column:span 5}
  .home .c-alert{grid-column:span 7} .home .c-quick{grid-column:span 5}
  .home .c-today{grid-column:span 7} .home .c-prog{grid-column:span 5}
}
.c-dday{display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:var(--accent-soft);box-shadow:none}
.dday-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dday-label{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.dday-num{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.dday-num small{font-size:20px;font-weight:700;letter-spacing:0;margin-left:6px;color:var(--ink2)}
.dday-range{font-size:14px;color:var(--ink2)}
.dday-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dday-days div{background:var(--card);border-radius:10px;padding:8px;font-size:12.5px;min-width:0}
.dday-days b{display:block;font-size:13px}
.dday-days span{color:var(--ink3);overflow-wrap:anywhere}
.dday-days .now{outline:2px solid var(--exam)}
@media (max-width:640px){.dday-days{grid-template-columns:repeat(3,minmax(0,1fr))}.dday-num{font-size:54px}}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--ink3)}
.pbar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14px;cursor:pointer;border:0;text-align:left;width:100%}
.alert .when{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card);color:var(--ink2);margin-top:1px}
.alert.hot .when{background:var(--danger-soft);color:var(--danger)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:10px 14px;text-align:left}
.quick button:hover{background:var(--sunk)}
.quick button b{font-size:15px}
.quick button span{font-size:12.5px;color:var(--ink3)}
.studyrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.studyrow label{font-size:13px;color:var(--ink2)}
.hm{display:inline-flex;align-items:center;gap:4px}
.hm input{width:62px;text-align:center}
.overdue{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.overdue h3{margin:0 0 6px;font-size:13px;color:var(--danger);font-weight:700}
.od-row{display:flex;align-items:center;gap:6px}
.od-row .tlist{flex:1;min-width:0}

/* 시간표 */
.tt{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:10px}
@media (max-width:1100px){.tt{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.ttday{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:6px;border:1.5px solid transparent;min-width:0}
.ttday.today{border-color:var(--accent)}
.ttday h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ttday h3 span{color:var(--ink3);font-weight:500;font-size:13px}
.cls{display:flex;align-items:stretch;gap:8px;width:100%;border:0;background:var(--sunk);border-radius:11px;padding:8px 10px 8px 8px;text-align:left;min-height:48px}
.cls:hover{filter:brightness(.98)}
.cls .per{flex:none;width:38px;font-size:12px;color:var(--ink3);font-weight:600;padding-top:2px;text-align:center}
.cls .cbody{flex:1;min-width:0}
.cls .cname{font-weight:600;font-size:14.5px;display:block;word-break:keep-all}
.cls .cnote{font-size:12px;color:var(--ink3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls.off{opacity:.55}
.cls.off .cname{text-decoration:line-through}
.st-chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;background:var(--card);color:var(--ink2);vertical-align:1px}
.st-chip.assess{color:var(--exam)}
.st-chip.chg{color:var(--accent)}
.st-chip.memo{color:var(--ok)}

/* 캘린더 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:12px;font-weight:700;color:var(--ink3);text-align:center;padding:4px 0}
.cell{min-height:104px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;overflow:hidden;cursor:pointer}
.cell:hover{border-color:var(--line2)}
.cell.other{opacity:.45}
.cell.today{border:1.5px solid var(--accent)}
.cell.exam{background:var(--exam-soft);border-color:transparent}
.cell .cd{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:4px}
.cell .cd .star{color:var(--exam);font-size:12px}
.cell .it{font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;padding:1px 4px}
.cell .it.evt{border:1px solid var(--line2);background:var(--card)}
.cell .it.done{opacity:.45;text-decoration:line-through}
.cell .more{font-size:11px;color:var(--ink3);padding-left:4px}
.cell .dots{display:none;gap:3px;flex-wrap:wrap}
.cell .dots i{width:6px;height:6px;border-radius:50%}
.cal.mini .cell{min-height:64px}
@media (max-width:640px){
  .cal{gap:3px}
  .cell{min-height:58px;padding:4px}
  .cell .it,.cell .more{display:none}

<script>var STANDALONE = true;</script>
<script>
/* ===== 학습 플래너: 순수 로직 (날짜, 과목, 시간표, 차시) ===== */
var START = '2026-10-21';
var EXAM_START = '2026-12-07', EXAM_END = '2026-12-11';

var REV = {
  kor: ['Claude 필기노트 제작','필기 정리','백지노트','ebsi','Claude 서술형 연습','Claude 한장정리노트','Claude 기출유사','다원국어 파이널 자료'],
  dawon: ['강의시청','복습','시험대비'],
  math: ['학교프린트 복습','도전문제 복습','도전문제 회독'],
  eng: ['필기 정리','회독','질문 정리','포스트잇 정리','백지노트','Claude 서술형 연습','Claude 한장정리노트','Claude 기출유사'],
  sci: ['필기 정리','회독','질문 정리','백지노트','완자','오투','기출 PICK','하이탑','Claude 서술형 연습','Claude 한장정리노트','Claude 기출유사'],
  soc: ['필기정리','회독','질문 정리','포스트잇 정리','백지 노트','자이스토리','ebsi','수능특강','Claude 플래시카드','Claude 서술형 연습','Claude 한장정리노트','Claude 기출유사'],
  his: ['타이핑 정리','회독','질문 정리','백지노트','기출 PICK','ebsi','Claude 플래시카드','Claude 서술형 연습','Claude 한장정리노트','Claude 기출유사']
};

var SUBJECTS = [
  ['국어A','kr','kor'],['국어B','kr','kor'],
  ['영어A','en','eng'],['영어B','en','eng'],['영어C','en','eng'],
  ['수학A','ma','math'],['수학Be','ma','math'],['수학B','ma','math'],
  ['사회A','so','soc'],['사회B','so','soc'],['사회C','so','soc'],
  ['과학A','sc','sci'],['과학B','sc','sci'],['과학C','sc','sci'],['과학D','sc','sci'],
  ['역사A','hi','his'],['역사B','hi','his'],['역사C','hi','his'],
  ['실험e','sc',null],['회화','en',null],['수학과외','ma',null],['다원국어','kr','dawon'],
  ['체육','pe',null],['미술','ar',null]
].map(function (r) { return { name: r[0], fam: r[1], rev: r[2] }; });
var SUBJ = new Map(SUBJECTS.map(function (s) { return [s.name, s]; }));
var NO_CHASI = new Set(['체육','미술','회화','실험e','수학과외','다원국어']);
/* 학교 밖 수업: 수업 안 함·수행평가 없음, 옮기기·삭제 가능, 과제 마감은 다음 수업 전 */
var FLEX = new Set(['다원국어','수학과외']);
var HW_OPTS = { '다원국어': ['워크북','추가문제집'], '수학과외': ['개념원리','쎈','고쟁이','오답 정리','추가문제'] };

/* 10월 21일부터 처음 진행되는 수업의 차시 */
var ANCHOR = {
  '사회A':3,'국어A':3,'과학C':1,'수학B':2,'역사B':2,'사회B':3,'영어A':1,'수학A':3,'과학B':3,
  '영어B':2,'수학Be':2,'사회C':2,'역사A':3,'국어B':3,'과학D':2,'과학A':2,'영어C':2,'역사C':3
};
/* 10/22 영어A는 수행평가일이라 차시를 세지 않음 */
var DEFAULT_SESSION_STATUS = { '2026-10-22_thu5': 'assess' };

function slots(day, rows) { return rows.map(function (r) { return { id: day + r[0], p: r[1], s: r[2] }; }); }
var DEFAULT_SETTINGS = {
  versions: [{
    id: 'v1', from: START,
    days: {
      1: slots('mon', [['1','1','수학Be'],['2','2','사회C'],['3','3','역사A'],['4','4','국어B'],['5','5','과학D'],['6','6','실험e'],['T','23:00','수학과외']]),
      2: slots('tue', [['1','1','과학A'],['2','2','국어B'],['3','3','수학A'],['4','4','미술'],['5','5','체육'],['6','6','영어C'],['7','7','역사C']]),
      3: slots('wed', [['1','1','사회A'],['2','2','체육'],['3','3','미술'],['4','4','미술'],['5','5','국어A'],['6','6','과학C'],['T','23:00','수학과외']]),
      4: slots('thu', [['1','1','수학B'],['2','2','회화'],['3','3','역사B'],['4','4','사회B'],['5','5~6','영어A'],['7','7','국어A']]),
      5: slots('fri', [['1','1','수학A'],['2','2','과학B'],['3','3','사회A'],['4','4','영어B']]),
      6: slots('sat', [['T','08:00','수학과외'],['D','14:00','다원국어']])
    }
  }],
  examSubjects: {},
  alerts: { review: true, hw: true, assess: true, times: ['08:00', '18:30'] }
};

function famOf(n) { var s = SUBJ.get(n); return s ? s.fam : 'gy'; }
function revOf(n) { var s = SUBJ.get(n); return s && s.rev ? REV[s.rev] : []; }
function hasChasi(n) { return !!n && !NO_CHASI.has(n); }

/* ---- 날짜 ---- */
function pad(n) { return String(n).padStart(2, '0'); }
function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pd(s) { var a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDays(s, n) { var d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
function dow(s) { return pd(s).getDay(); }
function weekStartOf(s) { return addDays(s, -((dow(s) + 6) % 7)); }
function diffDays(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
function isExam(s) { return s >= EXAM_START && s <= EXAM_END; }
function todayS() { return ds(new Date()); }
var WK = ['일','월','화','수','목','금','토'];
var WK_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtMD(s) { var d = pd(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WK[d.getDay()] + ')'; }
function fmtLong(s) { var d = pd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WK[d.getDay()] + '요일'; }
function fmtMin(m) {
  if (m == null) return '';
  var h = Math.floor(m / 60), mi = m % 60;
  if (h && mi) return h + 'H ' + mi + 'M';
  if (h) return h + 'H';
  return mi + 'M';
}

/* ---- 데이터 저장소(메모리) ---- */
var data = { tasks: new Map(), sessions: new Map(), events: new Map(), study: new Map(), meta: new Map() };
var idx = { tasksByDate: new Map(), sessionsByDate: new Map(), eventsByDate: new Map() };

function reindex(col) {
  if (col === 'tasks') {
    var m = new Map();
    data.tasks.forEach(function (t) { if (!t.date) return; if (!m.has(t.date)) m.set(t.date, []); m.get(t.date).push(t); });
    idx.tasksByDate = m;
  } else if (col === 'sessions') {
    var s = new Map();
    data.sessions.forEach(function (x) { if (!s.has(x.date)) s.set(x.date, []); s.get(x.date).push(x); });
    idx.sessionsByDate = s;
  } else if (col === 'events') {
    var e = new Map();
    data.events.forEach(function (x) { if (!e.has(x.date)) e.set(x.date, []); e.get(x.date).push(x); });
    idx.eventsByDate = e;
  }
}

function getSettings() {
  var s = data.meta.get('settings');
  if (!s) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  var out = JSON.parse(JSON.stringify(s));
  if (!out.versions || !out.versions.length) out.versions = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.versions));
  out.examSubjects = out.examSubjects || {};
  out.alerts = Object.assign({}, DEFAULT_SETTINGS.alerts, out.alerts || {});
  return out;
}

function versionFor(d, settings) {
  var vs = (settings || getSettings()).versions.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; });
  var v = null;
  vs.forEach(function (x) { if (x.from <= d) v = x; });
  return v;
}

function periodNum(p) { var m = String(p || '').match(/\d+/); return m ? +m[0] : 99; }
function isTimeLabel(p) { return /^\d{1,2}:\d{2}/.test(String(p || '')); }
function periodKey(p) {
  var t = String(p || '').match(/^(\d{1,2}):(\d{2})/);
  if (t) return 1000 + (+t[1]) * 60 + (+t[2]);
  var m = String(p || '').match(/^\d+/);
  return m ? +m[0] : 900;
}

function linkedCount(key) {
  var n = 0;
  data.tasks.forEach(function (t) { if (t.sessionKey === key) n++; });
  return n;
}

/* 한 날짜의 수업 목록(차시 계산 전 원본) */
function rawSessions(d, settings) {
  var out = [];
  if (d < START) return out;
  var v = versionFor(d, settings);
  var base = v ? (v.days[dow(d)] || []) : [];
  var docs = idx.sessionsByDate.get(d) || [];
  var byKey = new Map(docs.map(function (x) { return [x.id, x]; }));
  var used = new Set();
  base.forEach(function (sl) {
    var key = d + '_' + sl.id;
    used.add(key);
    out.push({ key: key, date: d, slotId: sl.id, p: sl.p, baseSubject: sl.s, extra: false, doc: byKey.get(key) || null });
  });
  docs.forEach(function (x) {
    if (used.has(x.id)) return;
    if (x.extra || (x.learned && x.learned.trim()) || linkedCount(x.id) > 0) {
      out.push({ key: x.id, date: d, slotId: x.slotId || null, p: x.p || '', baseSubject: x.baseSubject || x.subject, extra: !!x.extra, orphan: !x.extra, doc: x });
    }

/* ---------- 통계 ---------- */
function niceMax(v, minutes) {
  if (minutes) { var h = Math.ceil(v / 60); if (h < 1) h = 1; if (h % 2 && h > 2) h++; return h * 60; }
  if (v <= 4) return Math.max(v, 1);
  var p = Math.pow(10, Math.floor(Math.log10(v))); var n = Math.ceil(v / p) * p; return n;
}
function barSVG(items, opt) {
  var n = items.length;
  if (!n) return '';
  var bw = n > 20 ? 14 : n > 10 ? 20 : 30, gap = n > 20 ? 7 : 12, padL = 42, padB = 32, padT = 18, h = opt.compact ? 100 : 150;
  var W = padL + n * (bw + gap) + gap, H = padT + h + padB;
  var mxRaw = 0;
  items.forEach(function (x) { mxRaw = Math.max(mxRaw, x.v || 0, x.total || 0); });
  var mx = niceMax(mxRaw, opt.minutes);
  var y = function (v) { return padT + h - (v / mx) * h; };
  var g = '';
  [0, mx / 2, mx].forEach(function (t) {
    g += '<line class="gl" x1="' + padL + '" x2="' + (W - 4) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
      '<text class="ax" x="' + (padL - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + (opt.minutes ? (t / 60) + 'H' : Math.round(t)) + '</text>';
  });
  var step = n > 20 ? Math.ceil(n / 12) : 1;
  items.forEach(function (x, i) {
    var bx = padL + gap + i * (bw + gap);
    if (x.future) g += '<rect class="b-future" x="' + bx + '" y="' + (padT + h - 4) + '" width="' + bw + '" height="4" rx="2"/>';
    else if (opt.stack) {
      if (x.total) {
        g += '<rect class="b-total" x="' + bx + '" y="' + y(x.total) + '" width="' + bw + '" height="' + (padT + h - y(x.total)) + '" rx="4"/>';
        if (x.v) g += '<rect class="b-main" x="' + bx + '" y="' + y(x.v) + '" width="' + bw + '" height="' + (padT + h - y(x.v)) + '" rx="4"/>';
        if (n <= 16) g += '<text class="vlab" x="' + (bx + bw / 2) + '" y="' + (y(x.total) - 4) + '" text-anchor="middle">' + x.v + '/' + x.total + '</text>';
      }
    } else if (x.v == null) {
      g += '<rect class="b-none" x="' + (bx + .5) + '" y="' + (padT + h - 10) + '" width="' + (bw - 1) + '" height="10" rx="3"><title>기록 안 함</title></rect>';
    } else if (x.v === 0) {
      g += '<rect class="b-zero" x="' + bx + '" y="' + (padT + h - 2) + '" width="' + bw + '" height="2"><title>0분</title></rect>' +
        (n <= 16 ? '<text class="vlab" x="' + (bx + bw / 2) + '" y="' + (padT + h - 6) + '" text-anchor="middle">0</text>' : '');
    } else {
      g += '<rect class="b-main" x="' + bx + '" y="' + y(x.v) + '" width="' + bw + '" height="' + (padT + h - y(x.v)) + '" rx="4"><title>' + esc(opt.fmt ? opt.fmt(x.v) : x.v) + '</title></rect>' +
        (n <= 16 && !opt.compact ? '<text class="vlab" x="' + (bx + bw / 2) + '" y="' + (y(x.v) - 4) + '" text-anchor="middle">' + esc(opt.fmt ? opt.fmt(x.v) : x.v) + '</text>' : '');
    }
    if (i % step === 0) g += '<text class="ax" x="' + (bx + bw / 2) + '" y="' + (padT + h + 18) + '" text-anchor="middle">' + esc(x.label) + '</text>';
  });
  return '<div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;min-width:' + Math.min(W, 1200) + 'px;max-width:' + Math.max(W * 1.5, 360) + 'px" role="img" aria-label="' + esc(opt.label || '그래프') + '">' + g + '</svg></div>';
}
function rate(from, to) {
  var T = todayS();

function rangeFromPreset(p) {

  function save() {

    var active = st.status === 'held' || st.status === 'cont';
    if (active) {
      for (var r = 0; r < 3; r++) for (var i in st.rounds[r]) {
        var mm = st.rounds[r][i];

    var co = st.chasiOverride !== '' && hasChasi(st.subject) ? Math.max(1, parseInt(st.chasiOverride, 10) || 1) : null;
    var cur = data.sessions.get(key) || {};

      subject: st.subject !== s.baseSubject ? st.subject : null,
      status: st.status, learned: st.learned, cancelReason: st.reason, chasiOverride: co

    var made = 0;

      var chasiNow = liveChasi(key);
      st.removed.forEach(function (id) { var t = data.tasks.get(id); if (t && !t.done) del('tasks', id); });
      for (var rr = 0; rr < 3; rr++) {
        Object.keys(st.rounds[rr]).forEach(function (i) {
          var mm = st.rounds[rr][i], name = revs[i];
          if (!mm.on) { mm.parts.forEach(function (p) { if (p.taskId && !p.done) del('tasks', p.taskId); }); return; }
          var parts = mm.parts.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
          var cnt = parts.length;
          parts.forEach(function (p, k) {
            var f = { title: name + (cnt > 1 ? ' (' + (k + 1) + ')' : ''), memo: mm.memo, range: p.range || '', round: rr + 1, part: k + 1, partCount: cnt };
            if (p.taskId) {
              var ex = data.tasks.get(p.taskId); if (!ex) return;
              if (!p.done && ex.date !== p.date) { f.date = p.date; f.order = Date.now() + k; }
              patch('tasks', p.taskId, f);
            } else {
              createTask(Object.assign({ id: 'rv_' + key + '_' + (rr + 1) + '_' + i + '_' + Date.now().toString(36) + k, kind: 'review', subject: st.subject, method: name, date: p.date, sessionKey: key, chasi: chasiNow, order: Date.now() + k }, f));
              made++;
            }
          });
        });
      }
      st.hw.forEach(function (r) { made += createHwFromRow(r, st.subject, key); });
    }
    if (!flex && st.status !== 'cancel') st.as.forEach(function (r) { if (r.title.trim()) { createAssessment({ subject: st.subject, date: r.date, title: r.title.trim(), memo: r.memo, sessionKey: key, onlyAssess: r.only }); made++; } });
    toast('수업 기록을 저장했어요' + (made ? ' · 할 일 ' + made + '개 추가' : '') + '.');
    m.close();
  }
}

      { onClose: function () { if (!done) resolve(null); } });

    }
    function draw() {
      var cells = '';
      for (var i = 0; i < 14; i++) {

        var ev = dayEvents(d).length;

        cells += '<button type="button" class="dpc' + (d === view ? ' sel' : '') + (d === T ? ' today' : '') + (isExam(d) ? ' exam' : '') + (d < T ? ' past' : '') + '" data-d="' + d + '">' +
          '<span class="dw">' + WK[dow(d)] + '</span><b class="num">' + pd(d).getDate() + '</b><span class="dn">' + (open ? '할 일 ' + open : (ts.length ? '다 함' : '–')) + '</span>' +
          (ev ? '<i class="dev" title="일정"></i>' : '') + '</button>';
      }

      var cls2 = sessionsFor(view).filter(function (x) { return x.status !== 'cancel'; });
      box.innerHTML = '<div class="row"><button type="button" class="icon-btn" data-nav="-14" aria-label="이전 2주">‹</button><b class="spacer num" style="text-align:center">' + fmtMD(ws) + ' – ' + fmtMD(addDays(ws, 13)) + '</b><button type="button" class="icon-btn" data-nav="14" aria-label="다음 2주">›</button></div>' +

        '<div class="dpl"><h4>' + fmtLong(view) + (isExam(view) ? ' · ★ 시험 기간' : '') + '</h4>' +

        evs.map(function (e) { return '<div class="sline"><span class="kind">일정</span>' + esc((e.start ? e.start + ' ' : '') + e.title) + '</div>'; }).join('') +
        ts2.map(line).join('') + (!evs.length && !ts2.length ? '<div class="empty small">아직 할 일이 없어요</div>' : '') + '</div>';
      $('#dp-in', m.el).value = view;

      var b = e.target.closest('button'); if (!b) return;

      '<span class="hm"><input type="number" min="0" max="24" inputmode="numeric" data-sh="' + d + '" value="' + (r ? Math.floor(r.minutes / 60) : '') + '" aria-label="시간"><span class="small muted">H</span><input type="number" min="0" max="59" inputmode="numeric" data-sm="' + d + '" value="' + (r ? r.minutes % 60 : '') + '" aria-label="분"><span class="small muted">M</span></span></div>';
  }
  var m = openModal('날짜별 공부 시간', '<p class="note" style="margin:0">최근 2주를 한 번에 고칠 수 있어요. 비워 두면 기록하지 않은 날로 남고, 0을 넣으면 0분으로 기록돼요. 더 이전 날짜는 캘린더에서 그 날을 눌러 기록하세요.</p>' + (rows || '<div class="empty">10월 21일부터 기록할 수 있어요</div>'),
    '<button class="btn ghost" data-mclose>취소</button><button class="btn primary" data-ok>저장</button>');
  m.el.addEventListener('click', function (e) {
    if (!e.target.closest('[data-ok]')) return;
    var n = 0;
    m.el.querySelectorAll('[data-sh]').forEach(function (hEl) {
      var d = hEl.dataset.sh, mEl = m.el.querySelector('[data-sm="' + d + '"]');
      var hv = hEl.value.trim(), mv = mEl.value.trim();
      var ex = data.study.get(d);
      if (hv === '' && mv === '') { if (ex) { del('study', d); n++; } return; }
      var mins = (parseInt(hv, 10) || 0) * 60 + (parseInt(mv, 10) || 0);
      if (!ex || ex.minutes !== mins) { put('study', d, { date: d, minutes: Math.max(0, Math.min(1440, mins)) }); n++; }
    });
    toast(n ? '공부 시간을 저장했어요.' : '바뀐 내용이 없어요.');
    m.close();
  });
}

/* ---------- 클릭 처리 ---------- */
function go(view) { ui.view = view; lsSet('planner-view', view === 'day' ? 'calendar' : view); render(); window.scrollTo(0, 0); }
var ACT = {
  nav: function (el) { go(el.dataset.view); },
  toggle: function (el) { toggleDone(el.closest('[data-id]').dataset.id); },
  open: function (el) { openTask(el.closest('[data-id]').dataset.id); },
  opentask: function (el) { openTask(el.dataset.id); },
  event: function (el) { openEvent(el.dataset.id); },
  goday: function (el) { ui.day = el.dataset.date; go('day'); },
  addfor: function (el) { openAddFor(el.dataset.date); },
  'move-today': function (el) { var t = data.tasks.get(el.dataset.id); if (t) moveTask(t, todayS()); },
  session: function (el) { openSession(el.dataset.key); },
  'add-class': function (el) { openAddClass(el.dataset.date); },
  'new-hw': function () { openNewHw(); }, 'new-assess': function () { openNewAssess(); },
  'new-other': function () { openNewOther(); }, 'new-event': function () { openEvent(null); },
  'exam-edit': openExamEditor, 'tt-edit': openTTEditor, 'study-edit': openStudyEditor,
  'week-prev': function () { ui.week = addDays(ui.week, -7); render(); }, 'week-next': function () { ui.week = addDays(ui.week, 7); render(); }, 'week-now': function () { ui.week = weekStartOf(todayS()); render(); },
  'tt-prev': function () { ui.ttWeek = addDays(ui.ttWeek, -7); render(); }, 'tt-next': function () { ui.ttWeek = addDays(ui.ttWeek, 7); render(); }, 'tt-now': function () { ui.ttWeek = weekStartOf(todayS()); render(); },
  'month-prev': function () { var d = pd(ui.month + '-01'); d.setMonth(d.getMonth() - 1); ui.month = ds(d).slice(0, 7); render(); },
  'month-next': function () { var d = pd(ui.month + '-01'); d.setMonth(d.getMonth() + 1); ui.month = ds(d).slice(0, 7); render(); },
  'month-now': function () { ui.month = todayS().slice(0, 7); render(); },
  'day-prev': function () { ui.day = addDays(ui.day, -1); render(); }, 'day-next': function () { ui.day = addDays(ui.day, 1); render(); }, 'day-today': function () { ui.day = todayS(); render(); },
  hwf: function (el) { ui.hwFilter = el.dataset.v; render(); },
  calf: function (el) { ui.calFilter = el.dataset.v; render(); },
  'stat-preset': function (el) { ui.stats.preset = el.dataset.v; render(); },
  'study-save': function (el) {
    var d = el.dataset.date, p = el.dataset.idp;
    var hv = $('#' + p + 'h').value.trim(), mv = $('#' + p + 'm').value.trim();
    if (hv === '' && mv === '') { toast('시간이나 분을 넣어 주세요. 0분이면 0을 넣으면 돼요.'); return; }
    var mins = Math.max(0, Math.min(1440, (parseInt(hv, 10) || 0) * 60 + (parseInt(mv, 10) || 0)));
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    put('study', d, { date: d, minutes: mins });
    toast(fmtMD(d) + ' 공부 시간 ' + fmtMin(mins) + ' 저장했어요.');
  },
  'study-clear': function (el) { del('study', el.dataset.date); toast('기록을 지웠어요. 이 날은 미기록으로 표시돼요.'); },
  'alerts-save': function () {
    var ns = getSettings();
    ns.alerts = { review: $('#al-review').checked, hw: $('#al-hw').checked, assess: $('#al-assess').checked, times: [$('#al-t1').value || '08:00', $('#al-t2').value || '18:30'] };
    saveSettings(ns); toast('알림 설정을 저장했어요.');
  },
  backup: async function () {
    var out = { exportedAt: nowISO() };
    COLS.forEach(function (c) { out[c] = Array.from(data[c].values()); });
    var name = '학습플래너-백업-' + todayS() + '.json';
    var text = JSON.stringify(out, null, 1);
    if (SOLO) {
      try {
        var blob = new Blob([text], { type: 'application/json' });
        var file = null;
        try { file = new File([blob], name, { type: 'application/json' }); } catch (e) {}
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
        } else {
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
          document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        }
        lsSet('planner-last-backup', todayS());
        toast('백업 파일을 만들었어요. "파일에 저장"을 골라 보관해 두세요.');
        render();
      } catch (e) { if (!(e && e.name === 'AbortError')) toast('백업 파일을 만들지 못했어요.'); }
      return;
    }
    var dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) {}
    if (!dl) { toast('이 화면에서는 파일 저장을 쓸 수 없어요.'); return; }
    try { await dl.save({ filename: name, data: text }); toast('백업 파일을 저장했어요.'); }
    catch (e) { if (e && e.code !== 'declined') toast('백업 파일을 저장하지 못했어요.'); }
  }
};
document.addEventListener('click', function (e) {
  if (e.target.closest('.overlay')) return;
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.cell[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.closest('.overlay')) return;
  if (el.id === 'month-pick' && el.value) { ui.month = el.value; render(); }
  else if (el.id === 'day-pick' && el.value) { ui.day = el.value; render(); }
  else if (el.id === 'st-from' && el.value) { ui.stats.from = el.value; render(); }
  else if (el.id === 'st-to' && el.value) { ui.stats.to = el.value; render(); }
  else if (/^al-(review|hw|assess)$/.test(el.id)) el.closest('.cb').classList.toggle('on', el.checked);
  else if (el.id === 'restore-in' && el.files && el.files[0]) { restoreFrom(el.files[0]); el.value = ''; }
});

function restoreFrom(file) {
  var rd = new FileReader();
  rd.onload = async function () {
    var o;
    try { o = JSON.parse(rd.result); } catch (e) { toast('백업 파일을 읽지 못했어요. 이 플래너에서 저장한 .json 파일인지 확인해 주세요.'); return; }
    if (!o || !Array.isArray(o.tasks) || !Array.isArray(o.sessions)) { toast('이 플래너의 백업 파일이 아니에요.'); return; }
    var cnt = o.tasks.length + ' 할 일, ' + o.sessions.length + ' 수업 기록, ' + (o.events || []).length + ' 일정, ' + (o.study || []).length + '일 공부 시간';
    var ok = await confirmBox('백업 파일을 불러올까요?', '지금 이 아이패드의 기록이 백업 파일 내용으로 바뀌어요.\n백업 파일: ' + cnt + (o.exportedAt ? '\n만든 때: ' + o.exportedAt.slice(0, 10) : ''),
      [{ label: '취소', value: false, cls: 'ghost' }, { label: '불러오기', value: true, cls: 'primary' }]);
    if (!ok) return;
    COLS.forEach(function (c) { data[c] = new Map((o[c] || []).filter(function (x) { return x && x.id; }).map(function (x) { return [x.id, x]; })); reindex(c); });
    invalidateTL(); saveLocal(); lsSet('planner-seeded', '1'); render();
    toast('백업 파일을 불러왔어요.');
  };
  rd.readAsText(file);
}

/* ---------- 끌어서 순서 바꾸기 ---------- */
document.addEventListener('pointerdown', function (e) {
  var g = e.target.closest('[data-grip]');
  if (!g) return;
  var li = g.closest('.task'), ul = li && li.parentElement;
  if (!ul || !ul.dataset.date) return;
  e.preventDefault();
  var r = li.getBoundingClientRect();
  var ph = document.createElement('li');
  ph.className = 'task-ph'; ph.style.height = r.height + 'px';
  li.after(ph);
  li.classList.add('dragging');
  Object.assign(li.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', zIndex: 60 });
  dragState = { li: li, ul: ul, ph: ph, off: e.clientY - r.top };
  try { g.setPointerCapture(e.pointerId); } catch (x) {}
});
document.addEventListener('pointermove', function (e) {
  if (!dragState) return;
  var s = dragState;
  s.li.style.top = (e.clientY - s.off) + 'px';
  if (e.clientY < 70) window.scrollBy(0, -12); else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 12);
  var sibs = Array.from(s.ul.children).filter(function (c) { return c !== s.li && c !== s.ph && c.classList.contains('task') && !c.classList.contains('done'); });
  var placed = false;
  for (var i = 0; i < sibs.length; i++) {
    var rr = sibs[i].getBoundingClientRect();
    if (e.clientY < rr.top + rr.height / 2) { if (sibs[i].previousElementSibling !== s.ph) sibs[i].before(s.ph); placed = true; break; }
  }
  if (!placed && sibs.length) { var lastU = sibs[sibs.length - 1]; if (lastU.nextElementSibling !== s.ph) lastU.after(s.ph); }
});
function endDrag() {
  if (!dragState) return;
  var s = dragState;
  s.ph.replaceWith(s.li);
  s.li.classList.remove('dragging');
  s.li.removeAttribute('style');
  dragState = null;
  var ids = Array.from(s.ul.querySelectorAll('.task:not(.done)')).map(function (x) { return x.dataset.id; });
  ids.forEach(function (id, i) {
    var t = data.tasks.get(id);
    var o = (i + 1) * 1000;
    if (t && t.order !== o) patch('tasks', id, { order: o });
  });
  holdRender = false;
  scheduleRender();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ---------- 사이트 안 알림 ---------- */
var lastHM = null;
function hmNow() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
setInterval(function () {
  var hm = hmNow();
  if (todayS() !== T0) render();
  if (lastHM && backend !== 'pending') {
    var s = getSettings().alerts;
    var crossed = s.times.filter(function (t) { return lastHM < t && t <= hm; });
    if (crossed.length) {
      var T = todayS();
      var parts = [];
      if (s.review) { var n = (idx.tasksByDate.get(T) || []).filter(function (t) { return t.kind === 'review' && !t.done; }).length; if (n) parts.push('복습 ' + n + '개'); }
      var other = alertItems(T).filter(function (a) { return !a.review; });
      if (other.length) parts.push('마감·수행평가 ' + other.length + '건');
      if (parts.length) toast('오늘 남은 것: ' + parts.join(', '), { label: '보기', fn: function () { go('home'); } });
    }
  }
  lastHM = hm;
}, 20000);
lastHM = hmNow();

/* ---------- 시작 ---------- */
renderShell();
render();
initStore();
})();
</script>
